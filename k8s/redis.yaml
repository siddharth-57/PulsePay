apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsepay-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsepay-redis
  template:
    metadata:
      labels:
        app: pulsepay-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: pulsepay-redis
  ports:
    - port: 6379
      targetPort: 6379